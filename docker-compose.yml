version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: proyecto_ai_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-proyecto_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secretpassword}
      POSTGRES_DB: ${POSTGRES_DB:-proyecto_ai_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-proyecto_ai} -d ${POSTGRES_DB:-proyecto_ai_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: proyecto_ai_api
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-proyecto_ai}:${POSTGRES_PASSWORD:-secretpassword}@db:5432/${POSTGRES_DB:-proyecto_ai_db}
      SECRET_KEY: ${SECRET_KEY:-dev_secret_key_change_in_production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 10080
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
