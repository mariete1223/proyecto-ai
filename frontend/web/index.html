<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>VoxDaily - Voice Journal & Calendar</title>

    <!-- PWA & Mobile Web App Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="VoxDaily" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link
      rel="apple-touch-icon-precomposed"
      href="/apple-touch-icon-precomposed.png"
    />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <!-- The react-native-web recommended style reset -->
    <style id="expo-reset">
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
      }
      html,
      body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        background-color: #0f172a !important;
        overflow-x: hidden !important;
        -webkit-overflow-scrolling: touch;
      }
      body {
        overflow-x: hidden !important;
        background-color: #0f172a !important;
      }
      #root {
        display: flex;
        height: 100%;
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden !important;
        flex: 1;
        background-color: #0f172a !important;
      }
      input,
      select,
      textarea,
      button {
        font-family: inherit;
      }
    </style>
    <link rel="icon" href="/favicon.ico" />
  </head>
  <body>
    <noscript>
      Necesitas habilitar JavaScript para ejecutar esta aplicación.
    </noscript>
    <div id="root"></div>
  </body>
</html>
