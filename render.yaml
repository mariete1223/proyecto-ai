services:
  - type: web
    name: proyecto-ai-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: proyecto-ai-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOW_DEV_SQLITE
        value: "0"

databases:
  - name: proyecto-ai-db
    plan: free
    databaseName: proyecto_ai_db
    user: proyecto_ai
