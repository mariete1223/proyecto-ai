<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>VoxDaily - Voice Journal & Calendar</title>
    <meta
      name="description"
      content="VoxDaily - Tu diario personal y calendario inteligente por voz con IA. Crea todas las categorías y etiquetas que necesites para organizar tu vida a tu medida."
    />

    <!-- PWA & Mobile Web App Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="VoxDaily" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link
      rel="apple-touch-icon-precomposed"
      href="/apple-touch-icon-precomposed.png"
    />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="preload" as="image" href="/icon-192.png" type="image/png" />
    <link
      rel="preload"
      as="image"
      href="/apple-touch-icon.png"
      type="image/png"
    />

    <!-- The react-native-web recommended style reset & smooth splash animations -->
    <style id="expo-reset">
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
      }
      html,
      body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        background-color: #0f172a !important;
        overflow-x: hidden !important;
        -webkit-overflow-scrolling: touch;
      }
      body {
        overflow-x: hidden !important;
        background-color: #0f172a !important;
      }
      #root {
        display: flex;
        height: 100%;
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden !important;
        flex: 1;
        background-color: #0f172a !important;
      }
      input,
      select,
      textarea,
      button {
        font-family: inherit;
      }

      @keyframes vox-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.7;
        }
        50% {
          transform: scale(1.06);
          opacity: 1;
        }
      }
      @keyframes vox-bar {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }
      .vox-splash-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        background-color: #0f172a;
        margin: 0;
        padding: 24px;
        box-sizing: border-box;
      }
      .vox-icon-wrapper {
        position: relative;
        width: 88px;
        height: 88px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .vox-icon-glow {
        position: absolute;
        inset: -12px;
        background: radial-gradient(
          circle,
          rgba(56, 189, 248, 0.45) 0%,
          rgba(99, 102, 241, 0.25) 50%,
          transparent 75%
        );
        border-radius: 32px;
        filter: blur(14px);
        animation: vox-pulse 2.2s ease-in-out infinite;
      }
      .vox-icon-img {
        position: relative;
        width: 88px;
        height: 88px;
        border-radius: 22px;
        box-shadow:
          0 12px 30px -6px rgba(0, 0, 0, 0.6),
          0 0 0 1px rgba(255, 255, 255, 0.12);
        object-fit: cover;
      }
      .vox-splash-title {
        color: #ffffff;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.4px;
        margin-bottom: 5px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .vox-splash-subtitle {
        color: #94a3b8;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.2px;
        margin-bottom: 28px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .vox-loader-track {
        width: 130px;
        height: 4px;
        background: rgba(51, 65, 85, 0.5);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
      }
      .vox-loader-bar {
        position: absolute;
        top: 0;
        left: 0;
        width: 45%;
        height: 100%;
        background: linear-gradient(90deg, #38bdf8, #818cf8);
        border-radius: 999px;
        animation: vox-bar 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
    </style>
    <link rel="icon" href="/favicon.ico" />
  </head>
  <body>
    <noscript>
      Necesitas habilitar JavaScript para ejecutar esta aplicación.
    </noscript>
    <div id="root">
      <div class="vox-splash-container" id="voxdaily-preloader">
        <div class="vox-icon-wrapper">
          <div class="vox-icon-glow"></div>
          <img
            class="vox-icon-img"
            src="/icon-192.png"
            alt="VoxDaily"
            width="88"
            height="88"
          />
        </div>
        <div class="vox-splash-title">VoxDaily</div>
        <div class="vox-splash-subtitle">Voice Journal & Calendar</div>
        <div class="vox-loader-track">
          <div class="vox-loader-bar"></div>
        </div>
      </div>
    </div>
  </body>
</html>
