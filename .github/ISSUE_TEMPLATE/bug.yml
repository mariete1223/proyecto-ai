name: Defecto observado
description: Registrar evidencia y reproducibilidad antes de proponer una solucion
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Describe el comportamiento visible. Separa hechos de hipotesis.
  - type: textarea
    id: observed
    attributes:
      label: Comportamiento observado
      description: Que ocurrio, con que frecuencia y cual fue el impacto.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
      description: Que resultado visible deberia haberse producido.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Partir de...
        2. Hacer...
        3. Observar...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Entorno
      description: Cliente, dispositivo o navegador, build y backend relevantes.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidencia
      description: Arrastra capturas o incluye logs y referencias sin datos sensibles.
    validations:
      required: true
  - type: textarea
    id: triage
    attributes:
      label: Triage inicial
      description: Clasificacion, hechos confirmados, hipotesis y datos que faltan.
    validations:
      required: true
  - type: input
    id: fingerprint
    attributes:
      label: Huella de deduplicacion
      description: Valor estable feature-sintoma-normalizado usado para buscar duplicados.
      placeholder: tags-duplicate-normalized-name
    validations:
      required: true
  - type: textarea
    id: duplicates
    attributes:
      label: Duplicados comprobados
      description: Issues y borradores revisados, o coincidencia reutilizada.
    validations:
      required: true
