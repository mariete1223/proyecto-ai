openapi: 3.1.0
info:
  title: Proyecto AI API
  version: 0.1.0
paths:
  /api/v1/auth/register:
    post:
      tags:
      - auth
      summary: Register a new user
      operationId: register_api_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Login
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/me:
    get:
      tags:
      - auth
      summary: Get Me
      operationId: get_me_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
      security:
      - HTTPBearer: []
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: Logout
      operationId: logout_api_v1_auth_logout_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
      security:
      - HTTPBearer: []
  /api/v1/categories:
    get:
      tags:
      - categories
      summary: Get User Categories
      operationId: get_user_categories_api_v1_categories_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CategoryResponse'
                type: array
                title: Response Get User Categories Api V1 Categories Get
      security:
      - HTTPBearer: []
    post:
      tags:
      - categories
      summary: Create New Category
      operationId: create_new_category_api_v1_categories_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/categories/{category_id}:
    get:
      tags:
      - categories
      summary: Get User Category By Id
      operationId: get_user_category_by_id_api_v1_categories__category_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: category_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Category Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - categories
      summary: Update User Category
      operationId: update_user_category_api_v1_categories__category_id__put
      security:
      - HTTPBearer: []
      parameters:
      - name: category_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Category Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - categories
      summary: Delete User Category
      operationId: delete_user_category_api_v1_categories__category_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: category_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Category Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/tags:
    get:
      tags:
      - tags
      summary: Get User Tags
      operationId: get_user_tags_api_v1_tags_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TagResponse'
                type: array
                title: Response Get User Tags Api V1 Tags Get
      security:
      - HTTPBearer: []
    post:
      tags:
      - tags
      summary: Create New Tag
      operationId: create_new_tag_api_v1_tags_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/tags/{tag_id}:
    get:
      tags:
      - tags
      summary: Get User Tag By Id
      operationId: get_user_tag_by_id_api_v1_tags__tag_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: tag_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Tag Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - tags
      summary: Update User Tag
      operationId: update_user_tag_api_v1_tags__tag_id__put
      security:
      - HTTPBearer: []
      parameters:
      - name: tag_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Tag Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - tags
      summary: Delete User Tag
      operationId: delete_user_tag_api_v1_tags__tag_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: tag_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Tag Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/entries:
    post:
      tags:
      - entries
      summary: Create New Entry
      operationId: create_new_entry_api_v1_entries_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - entries
      summary: Get User Entries
      operationId: get_user_entries_api_v1_entries_get
      security:
      - HTTPBearer: []
      parameters:
      - name: start_at
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Start At
      - name: end_at
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: End At
      - name: category_ids
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
              format: uuid
          - type: 'null'
          title: Category Ids
      - name: tag_ids
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
              format: uuid
          - type: 'null'
          title: Tag Ids
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEntriesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/entries/{entry_id}:
    get:
      tags:
      - entries
      summary: Get User Entry By Id
      operationId: get_user_entry_by_id_api_v1_entries__entry_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: entry_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Entry Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - entries
      summary: Update User Entry
      operationId: update_user_entry_api_v1_entries__entry_id__put
      security:
      - HTTPBearer: []
      parameters:
      - name: entry_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Entry Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - entries
      summary: Delete User Entry
      operationId: delete_user_entry_api_v1_entries__entry_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: entry_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Entry Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/tasks/pending:
    get:
      tags:
      - tasks
      summary: Get Pending Dateless Tasks
      operationId: get_pending_dateless_tasks_api_v1_tasks_pending_get
      security:
      - HTTPBearer: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEntriesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/tasks/{entry_id}/status:
    patch:
      tags:
      - tasks
      summary: Update Entry Task Status
      operationId: update_entry_task_status_api_v1_tasks__entry_id__status_patch
      security:
      - HTTPBearer: []
      parameters:
      - name: entry_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Entry Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskStatusUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/preferences/save-mode:
    get:
      tags:
      - preferences
      summary: Get User Save Preference
      operationId: get_user_save_preference_api_v1_preferences_save_mode_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavePreferenceResponse'
      security:
      - HTTPBearer: []
    put:
      tags:
      - preferences
      summary: Update User Save Preference
      operationId: update_user_save_preference_api_v1_preferences_save_mode_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavePreferenceUpdate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavePreferenceResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/corrections:
    post:
      tags:
      - corrections
      summary: Create New Capture Correction
      operationId: create_new_capture_correction_api_v1_corrections_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptureCorrectionCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureCorrectionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - corrections
      summary: Get User Capture Corrections
      operationId: get_user_capture_corrections_api_v1_corrections_get
      security:
      - HTTPBearer: []
      parameters:
      - name: entry_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Entry Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CaptureCorrectionResponse'
                title: Response Get User Capture Corrections Api V1 Corrections Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sync/push:
    post:
      tags:
      - sync
      summary: Push Client Changes
      operationId: push_client_changes_api_v1_sync_push_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncPushRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPushResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/sync/pull:
    get:
      tags:
      - sync
      summary: Pull Server Changes
      operationId: pull_server_changes_api_v1_sync_pull_get
      security:
      - HTTPBearer: []
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPullResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /health:
    get:
      summary: Health Check
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Check Health Get
components:
  schemas:
    CaptureCorrectionCreate:
      properties:
        entry_id:
          type: string
          format: uuid
          title: Entry Id
        capture_session_id:
          type: string
          format: uuid
          title: Capture Session Id
        field:
          $ref: '#/components/schemas/CorrectionField'
        interpreted_value:
          anyOf:
          - {}
          - type: 'null'
          title: Interpreted Value
        accepted_value:
          anyOf:
          - {}
          - type: 'null'
          title: Accepted Value
      type: object
      required:
      - entry_id
      - capture_session_id
      - field
      title: CaptureCorrectionCreate
    CaptureCorrectionResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        user_id:
          type: string
          format: uuid
          title: User Id
        entry_id:
          type: string
          format: uuid
          title: Entry Id
        capture_session_id:
          type: string
          format: uuid
          title: Capture Session Id
        field:
          $ref: '#/components/schemas/CorrectionField'
        interpreted_value:
          anyOf:
          - {}
          - type: 'null'
          title: Interpreted Value
        accepted_value:
          anyOf:
          - {}
          - type: 'null'
          title: Accepted Value
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        version:
          type: integer
          title: Version
      type: object
      required:
      - id
      - user_id
      - entry_id
      - capture_session_id
      - field
      - created_at
      - updated_at
      - version
      title: CaptureCorrectionResponse
    CategoryCreate:
      properties:
        kind:
          $ref: '#/components/schemas/CategoryKind'
          default: STANDARD
        name:
          type: string
          maxLength: 100
          minLength: 1
          title: Name
        voice_command:
          type: string
          maxLength: 100
          minLength: 1
          title: Voice Command
        description:
          type: string
          maxLength: 1000
          minLength: 1
          title: Description
          default: Categoría de usuario
        color:
          type: string
          maxLength: 7
          minLength: 7
          title: Color
        icon:
          type: string
          maxLength: 100
          minLength: 1
          title: Icon
      type: object
      required:
      - name
      - voice_command
      - color
      - icon
      title: CategoryCreate
    CategoryKind:
      type: string
      enum:
      - STANDARD
      - TASK
      - EVENT
      - CAPTURE
      title: CategoryKind
    CategoryResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        user_id:
          type: string
          format: uuid
          title: User Id
        kind:
          $ref: '#/components/schemas/CategoryKind'
        name:
          type: string
          title: Name
        voice_command:
          type: string
          title: Voice Command
        description:
          type: string
          title: Description
        color:
          type: string
          title: Color
        icon:
          type: string
          title: Icon
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        version:
          type: integer
          title: Version
      type: object
      required:
      - id
      - user_id
      - kind
      - name
      - voice_command
      - description
      - color
      - icon
      - created_at
      - updated_at
      - version
      title: CategoryResponse
    CategoryUpdate:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 100
            minLength: 1
          - type: 'null'
          title: Name
        voice_command:
          anyOf:
          - type: string
            maxLength: 100
            minLength: 1
          - type: 'null'
          title: Voice Command
        description:
          anyOf:
          - type: string
            maxLength: 1000
            minLength: 1
          - type: 'null'
          title: Description
        color:
          anyOf:
          - type: string
            maxLength: 7
            minLength: 7
          - type: 'null'
          title: Color
        icon:
          anyOf:
          - type: string
            maxLength: 100
            minLength: 1
          - type: 'null'
          title: Icon
      type: object
      title: CategoryUpdate
    CorrectionField:
      type: string
      enum:
      - CATEGORY_ID
      - OCCURRED_AT
      - CONTENT
      - TAG_IDS
      title: CorrectionField
    EntryCreate:
      properties:
        category_id:
          type: string
          format: uuid
          title: Category Id
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        occurred_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Occurred At
        content:
          type: string
          maxLength: 10000
          minLength: 1
          title: Content
        task_status:
          anyOf:
          - $ref: '#/components/schemas/TaskStatus'
          - type: 'null'
        task_priority:
          anyOf:
          - $ref: '#/components/schemas/TaskPriority'
          - type: 'null'
        task_recurrence:
          anyOf:
          - $ref: '#/components/schemas/TaskRecurrence'
          - type: 'null'
        tag_ids:
          items:
            type: string
            format: uuid
          type: array
          title: Tag Ids
      type: object
      required:
      - category_id
      - content
      title: EntryCreate
    EntryResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        user_id:
          type: string
          format: uuid
          title: User Id
        category_id:
          type: string
          format: uuid
          title: Category Id
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        occurred_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Occurred At
        content:
          type: string
          title: Content
        task_status:
          anyOf:
          - $ref: '#/components/schemas/TaskStatus'
          - type: 'null'
