services:
  - type: web
    name: proyecto-ai-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOW_DEV_SQLITE
        value: "0"
      - key: ENVIRONMENT
        value: "production"

