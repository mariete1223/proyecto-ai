name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies from lockfile
        run: npm ci
        working-directory: frontend

      - name: Run frontend format, lint, type, and test checks
        run: npm run check
        working-directory: frontend

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies from lockfile
        run: uv sync --directory backend --frozen

      - name: Run backend format, lint, type, and test checks
        run: uv run --directory backend python scripts/check.py

  cd-deploy:
    name: Continuous Deployment (CD)
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify deployment readiness
        run: |
          echo "All frontend and backend checks passed successfully."
          echo "Automated continuous delivery pipeline triggered for main branch."

      - name: Trigger Render Deploy Hook (if configured)
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl -s -f -X POST "$RENDER_DEPLOY_HOOK"
            echo "Render deployment hook triggered successfully."
          else
            echo "RENDER_DEPLOY_HOOK secret is not configured; skipping Render trigger."
          fi
